alignment:
  namespace: "LatticeGauge"
  statements:
    - source: "Stone 59 — attained optimal budgets for fixed additive covers (project source entry; integrated at commit 1dab07ab9da3052c7b957f858ccaf084501ecf4d, no release, deposit or reserved DOI of its own)"
      lean: "LatticeGauge.abs_profileExpectation_sub_profileExpectation_le_optimal_cover"
      module: "Phase3/LatticeGauge/ActivityProfileDampingOptimalCover.lean"
      status: "proved"
      note: "|profileExpectation f s R a − profileExpectation f s R a′| ≤ (2·Cf)·exp(6·D_s/113)·B* for profiles a, a′ : Polymer N → ℝ with values in [0, 1], the damping region R kept in the functional, a fixed finite family of change regions r i with scales n i and separations WalkBarrierSeparated s (r i) (n i) (m = 0 admitted, overlaps and repetitions allowed), and Reaches R r a a′ (every polymer whose effective factors touchFactor R a, touchFactor R a′ differ touches some r i; equivalent under the profile bounds to the existence of an admissible budget), where a budget δ : Fin m → ℝ is admissible when δ i ≥ 0 and it is an additive cover of the effective changes (the Stone 58 hypothesis), B(δ) = ∑ i, δ i·exp(−(n i)/2), and B* = ActivityProfileOptimalCover.minCost is the attained minimum of B over all admissible budgets (clipping at 1 preserves admissibility and does not increase the cost; the feasible set [0,1]^m ∩ {additive cover} is compact and non-empty under Reaches; the minimizer on the box is global, coordinates greater than 1 included; optimalBudget by classical choice, minCost its cost, both carrying the profile bounds and Reaches in their types); under the regime, measurability and majorant hypotheses of the Stone 58 capstone (0 ≤ β ≤ 1/40000, Measurable f, |f| ≤ Cf with 0 ≤ Cf derived); exactly the constant, rate and regime of Stones 54–58; two-term form with Cf·[exp(6·D_s/113) + exp(4·D_s/113)]·B*; B* ≤ B(δ) for every admissible δ, B* ≥ 0, the value unique and independent of the minimizer, the vector not unique in general, B* = 0 iff all effective factors coincide; the optimal bound at most the Stone 58 bound of every admissible budget and both Stone 58 statements recovered from the optimal ones (compatibility checks, the Stone 58 estimates being the input); m = 0 under Reaches and B* = 0 give exact equality, R = ∅ gives Reaches for arbitrary real profiles; no minimizer, budget or decomposition supplied by the user, no m > 0, no disjointness, no r i ⊆ R, no separation of s from R, no unit background, no δ i ≤ 1 on the budgets compared, no DependsOnlyOn f s, nothing divided by budgets, costs or differences of profiles; optimization of the cost of the budgets for a fixed family and fixed scales only — no optimization of the regions or scales, no numerical algorithm, no linear-programming duality, no universal strict improvement, no optimal constant, no uniqueness of the minimizer, no monotonicity of the functional, no priority claimed."
    - source: "Stone 58 — stability of the profile-damped functional under an additive cover of the effective changes by several regions (project source entry; integrated at commit 69706b9a13a23b0f132418f2390d4030e1fcc78b; Version 58, tag zenodo-v58, GitHub Release, Zenodo DOI 10.5281/zenodo.23439473)"
      lean: "LatticeGauge.abs_profileExpectation_sub_profileExpectation_le_additive_cover"
      module: "Phase3/LatticeGauge/ActivityProfileDampingAdditiveCover.lean"
      status: "proved"
      note: "|profileExpectation f s R a − profileExpectation f s R a′| ≤ (2·Cf)·exp(6·D_s/113)·∑ i : Fin m, δ i·exp(−(n i)/2) for profiles a, a′ : Polymer N → ℝ with values in [0, 1], the damping region R kept in the functional, a finite family of change regions r i with separations WalkBarrierSeparated s (r i) (n i) and budgets δ i ≥ 0 (m = 0 admitted, overlaps and repetitions allowed), and the additive cover — for every polymer η, |touchFactor R a η − touchFactor R a′ η| ≤ ∑ i, if typedTouchesSupport η (r i) then δ i else 0, the regions a polymer touches sharing the cost of its change — under the regime, measurability and majorant hypotheses of the Stone 57 capstone (0 ≤ β ≤ 1/40000, Measurable f, |f| ≤ Cf with 0 ≤ Cf derived); exactly the constant, rate and regime of Stone 57; no owner or decomposition in the signature, no m > 0, no disjointness, no r i ⊆ R, no separation of s from R, no unit background, no δ i ≤ 1, no DependsOnlyOn f s, nothing divided by budgets, accumulated capacities or differences of profiles, no factor of m outside the sum; two-term form with Cf·[exp(6·D_s/113) + exp(4·D_s/113)]·∑ i, δ i·exp(−(n i)/2); the route builds intermediate profiles by a truncated scalar move towards the target with the prefix capacities of the regions and applies the published Stone 56 two-term estimate at every step with the Stone 57 finite telescoping (the Stone 57 capstone is not used); the Stone 57 cover implies the additive cover, so both Stone 57 estimates are recovered by specialization, and the converse fails on a parametric witness; one region recovers the Stone 56 statement; the empty family and zero budgets give exact equality with no analytic hypothesis; the gain is on the hypothesis with the same right-hand side — no universal numerical improvement, optimal sum or order, optimality or priority claimed."
    - source: "Stone 57 — multi-region stability of the profile-damped functional, a finite composition of the Stone 56 estimate (project source entry; integrated at commit b66c255c83bba02dc8d53158279296bbf7ea005c; Version 57, tag zenodo-v57, GitHub Release, Zenodo DOI 10.5281/zenodo.23305142)"
      lean: "LatticeGauge.abs_profileExpectation_sub_profileExpectation_le_multiregion"
