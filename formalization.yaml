version: "v0.4"

project:
  name: "Finite-Volume Lattice Gauge Theory in Lean 4 — A Formalization Program Around the Yang–Mills Mass Gap"
  description: >
    Exploratory, multi-phase Lean 4 / Mathlib formalization of finite-volume
    lattice gauge theory. The active library is Phase 3, namespace
    `LatticeGauge` (Phase3/LatticeGauge): Wilson action, Gibbs
    measure, gauge invariance of the Gibbs expectation, Haar probability
    measure on U(n), translation invariance, the β = 0 product state and its
    factorization, and a polymer / cluster expansion of Kotecký–Preiss type in
    the small-β (strong-coupling, Wilson convention) regime. Principal results:
    Version 49 — finite-volume cluster-expansion identity for the log partition
    function; Version 50 — finite-volume exponential covariance decay of two
    local observables; Version 51 — finite-volume exponential stability of a
    local observable functional under remote hard restriction of polymer
    activities, |gibbsExpectation f − activityRestrictedExpectation f s r| ≤
    2·Cf·exp(8·D_s/113)·exp(−n/2) for 0 ≤ β ≤ 1/40000 and walk separation n;
    Version 52 (deposited; commit f4015c5c8e7376a924c3ec3ab3dc7c00097e6085,
    tag zenodo-v52, Zenodo record dated 2026-09-13) — finite-volume exponential stability under continuous
    remote polymer-activity damping, |gibbsExpectation f −
    activityDampedExpectation f s r θ| ≤ (1 − θ)·2·Cf·exp(8·D_s/113)·exp(−n/2)
    for 0 ≤ θ ≤ 1, with θ = 0 recovering the Version 51 estimate; Version 53
    (commit 571b83aadb53838eb8257c015b7c02d3e57d30ad, tag zenodo-v53, GitHub
    Release published, Zenodo record DOI 10.5281/zenodo.22750453 published on
    2026-09-14 as confirmed by the coordinator and a capture of the record
    page) — Lipschitz stability of the damped
    functional in the damping parameter, |activityDampedExpectation f s r θ −
    activityDampedExpectation f s r θ′| ≤ |θ − θ′|·2·Cf·exp(8·D_s/113)·exp(−n/2)
    for θ, θ′ ∈ [0, 1], without DependsOnlyOn f s between the two functionals;
    Version 54 (Stone 54, integrated on main at commit
    9c0f6fdecee5c8628a2434d032e421edc78bb722; snapshot commit
    9358faa27b44ce24b3b9fe035cba94a68448e034, tag zenodo-v54, GitHub Release
    published, Zenodo record DOI 10.5281/zenodo.22767474 published on
    2026-09-15 as confirmed by the coordinator and a capture of the record
    page; superseded by Version 55) — the same estimate with the
    refined prefactor exp(6·D_s/113), under the same hypotheses, interval
    and rate; Version 55 (Stone 55, integrated on main at commit
    d6ce3d7232f08b5f975dfa8c6f43ec5031937e10, PR #33; snapshot commit
    445cc76b02550291e6524bb1bf631aac4cc86c61, tag zenodo-v55, GitHub Release
    published on 2026-09-20, Zenodo record DOI 10.5281/zenodo.22850085
    published on 2026-09-19 as confirmed by the coordinator and a capture of
    the record page; superseded by Version 56) — the same estimate with the scalar damping parameter
    replaced by a profile of factors a : Polymer N → ℝ, one per polymer
    touching r, |profileExpectation f s r a − profileExpectation f s r a′| ≤
    δ·2·Cf·exp(6·D_s/113)·exp(−n/2) for profiles with values in [0, 1] and
    0 ≤ δ majorizing |a η − a′ η| on the polymers touching r, without
    DependsOnlyOn f s and without δ ≤ 1; constant profiles recover the
    Version 54 estimate as an application.
    Version 56 (Stone 56, integrated on main at commit
    ead481456bc8637b2b7c22e867cc49f99f4ab375, PR #37; snapshot commit
    95091fdd07398a7b42901829ad61e4e2c26d5aaa, tag zenodo-v56, GitHub Release
    published on 2026-10-01, Zenodo record DOI 10.5281/zenodo.22949184
    published as confirmed by the coordinator, the exact Zenodo date not
    established by the documentary sessions; superseded by Version 57)
    — the same estimate with the separation
    localized on the region r where the effective factors touchFactor R a,
    touchFactor R a′ change, the damping region R kept in the functional,
    weights and exponents and a common damping background preserved outside
    r: |profileExpectation f s R a − profileExpectation f s R a′| ≤
    δ·2·Cf·exp(6·D_s/113)·exp(−n/2) for profiles in [0, 1] with equal
    effective factors outside r, |touchFactor R a − touchFactor R a′| ≤ δ on
    r and WalkBarrierSeparated s r n, without separation of s from R, without
    r ⊆ R, without a unit background, without DependsOnlyOn f s and without
    δ ≤ 1; with R = r the Version 55 estimate is recovered as an application.
    Version 57 (Stone 57, integrated on main at commit
    b66c255c83bba02dc8d53158279296bbf7ea005c, PR #39; snapshot commit
    18c6ff084020e52c8932ecfd20e4b19f47efdf02, tag zenodo-v57, GitHub Release
    published on 2026-10-11, Zenodo record DOI 10.5281/zenodo.23305142
    published as confirmed by the coordinator, the exact Zenodo date not
    established by the documentary sessions; superseded by Version 58)
    — the Version 56 estimate composed over a finite
    family of change regions r i with separations n i and majorants δ i
    (i : Fin m, m = 0 included, overlaps allowed), under a cover of the
    effective changes by polymers (every polymer whose effective factors
    touchFactor R a, touchFactor R a′ differ touches some r i with
    |touchFactor R a − touchFactor R a′| ≤ δ i for that same i):
    |profileExpectation f s R a − profileExpectation f s R a′| ≤
    2·Cf·exp(6·D_s/113)·∑ i, δ i·exp(−(n i)/2) for profiles in [0, 1],
    without an owner in the signature, m > 0, disjointness, r i ⊆ R,
    separation of s from R, a unit background, δ i ≤ 1 or DependsOnlyOn f s;
    a composition derived from the Version 56 estimate (consumed at every
    step); one region recovers the Version 56 estimate as an application and
    the empty family gives exact equality.
    Version 58 (Stone 58, integrated on main at commit
    69706b9a13a23b0f132418f2390d4030e1fcc78b, PR #42; snapshot commit
    52cc0915547a13c0b738b0b506d572d00b011a12, tag zenodo-v58, GitHub Release
    published on 2026-10-18, Zenodo record DOI 10.5281/zenodo.23439473
    published as confirmed by the coordinator, the exact Zenodo date not
    established by the documentary sessions; the current deposited version)
    — the Version 57 estimate under an ADDITIVE cover
    of the effective changes: for every polymer, |touchFactor R a −
    touchFactor R a′| ≤ ∑ i, if typedTouchesSupport η (r i) then δ i else 0
    (the regions a polymer touches share the cost of its change; no single
    region has to pay it), with the same conclusion
    |profileExpectation f s R a − profileExpectation f s R a′| ≤
    2·Cf·exp(6·D_s/113)·∑ i, δ i·exp(−(n i)/2), the same constant, rate and
    regime, profiles in [0, 1], budgets δ i ≥ 0 and WalkBarrierSeparated s
    (r i) (n i); without an owner or decomposition in the signature, m > 0,
    disjointness, r i ⊆ R, separation of s from R, a unit background,
    δ i ≤ 1 or DependsOnlyOn f s, and nothing divided by budgets, capacities
    or differences of profiles; the Version 57 cover implies the additive one
    (both Version 57 estimates recovered by specialization), the converse
    fails on a parametric witness; one region recovers the Version 56
    estimate; the empty family and zero budgets give exact equality; a
    composition using the Version 56 estimate at every step (the Version 57
    capstone not used).
    Stone 59 (integrated on main at commit
    1dab07ab9da3052c7b957f858ccaf084501ecf4d, PR #44; no release, deposit or
    reserved DOI of its own) — the Version 58 estimate with the cost of the
    additive cover minimized over the admissible budgets of a FIXED family of
    regions r i with fixed scales n i: a budget δ is admissible when δ i ≥ 0
    and it is an additive cover of the effective changes; B(δ) = ∑ i,
    δ i·exp(−(n i)/2); B* = min { B(δ) : δ admissible } is attained (clipping
    at 1 preserves admissibility and does not increase the cost; the feasible
    set [0,1]^m ∩ {additive cover} is compact and, under Reaches R r a a′ —
    every polymer whose effective factor changes touches some r i,
    equivalent under the profile bounds to the existence of an admissible
    budget — non-empty; the minimizer on the box is a minimizer among all
    admissible budgets, coordinates greater than 1 included); optimalBudget
    is that minimizer by classical choice and minCost its cost, both
    carrying the profile bounds and Reaches in their types; then
    |profileExpectation f s R a − profileExpectation f s R a′| ≤
    2·Cf·exp(6·D_s/113)·B*, the same constant, rate and regime; B* ≤ B(δ) for
    every admissible δ, B* ≥ 0, the value unique and independent of the
    minimizer (the vector not unique in general), B* = 0 iff all effective
    factors coincide; the optimal bound at most the Version 58 bound of every
    admissible budget, both Version 58 statements recovered from the optimal
    ones (a compatibility check, not an independent proof of Version 58,
    whose estimates are the input), m = 0 and B* = 0 giving exact equality;
    no minimizer, budget or decomposition supplied by the user, no m > 0,
    disjointness, r i ⊆ R, separation of s from R, unit background, δ i ≤ 1
    on the budgets compared or DependsOnlyOn f s; the optimization is of the
    cost of the budgets only (not of the regions, the scales, the actual
    deviation or a universal constant), by classical existence without a
    numerical algorithm or a formalized linear-programming duality; strict
    improvements of the cost exhibited on particular witnesses, none
    universal.
    Every result in the verified Phase 3 library is a finite-lattice statement:
    no thermodynamic or continuum
    limit and no mass-gap theorem is claimed, and the project does not prove
    the continuum Yang–Mills existence or mass-gap statement required by the
    Clay Millennium Problem. Phases 1 and 2 are exploratory legacy material with
    explicit named hypotheses and are not part of the verified Phase 3 library.
