status:
  scope: >
    Verified scope (Phase 3, Phase3/LatticeGauge): finite periodic 4-dimensional
    lattice, compact gauge group with a probability base measure and a bounded
    measurable character χ with |χ| ≤ 1; Gibbs measure and expectation; gauge
    and translation invariance; Haar probability on U(n) with unconditional
    capstones |⟨W⟩| ≤ 1; β = 0 factorization; polymer gas and Kotecký–Preiss
    type cluster expansion with explicit constants in the small-β
    (strong-coupling) regime; exponential covariance decay (Version 50);
    exponential stability under remote polymer-activity restriction (Version
    51); exponential stability under continuous remote polymer-activity
    damping with the factor (1 − θ) (Version 52); and Lipschitz stability of
    the damped functional in the damping parameter with the factor |θ − θ′|
    and the same constant, without DependsOnlyOn f s between the two
    functionals (Version 53), the same estimate with the refined prefactor
    exp(6·D_s/113) (Version 54, tag zenodo-v54, GitHub Release, Zenodo DOI
    10.5281/zenodo.22767474), and the same estimate for a profile of activity
    factors, one per polymer, with a uniform majorant δ of the profile
    difference in the place of |θ − θ′| (Version 55, tag zenodo-v55, GitHub
    Release, Zenodo DOI 10.5281/zenodo.22850085), and the same estimate with
    the separation localized on the region where the effective factors of the
    profiles change, a common damping background being preserved elsewhere
    (Version 56, tag zenodo-v56, GitHub Release, Zenodo DOI
    10.5281/zenodo.22949184), and the same estimate composed over a finite
    family of change regions, each with its own separation and majorant,
    under a cover of the effective changes by polymers, the single cost
    replaced by the finite sum of the individual costs (Version 57, tag
    zenodo-v57, GitHub Release, Zenodo DOI 10.5281/zenodo.23305142), and the
    same estimate under an additive cover of the effective changes, the
    regions a polymer touches sharing the cost of its change, with the same
    constant, rate and regime (Version 58, tag zenodo-v58, GitHub Release,
    Zenodo DOI 10.5281/zenodo.23439473), and the same estimate with the cost
    of that additive cover minimized over the admissible budgets of a fixed
    family of regions and scales, the minimum attained by compactness of the
    clipped feasible set, with the same constant, rate and regime (Stone 59,
    integrated at commit 1dab07ab…, not deposited). Out of scope:
    thermodynamic limit, continuum limit, second Gibbs measures or boundary
    conditions, per-link profiles, spatial-mixing theorems, monotonicity of
    the damped functional in θ or in the profile or a derivative in them,
    optimality or priority of the constants, optimization of the regions or
    the scales, a numerical algorithm or a linear-programming duality for the
    optimal budget, uniqueness of the minimizing budget, mass gap
    (HasLatticeMassGap is stated, not proved), and the Clay Millennium
    Problem.
    Phases 1 and 2 (namespaces YangMills, RGFlow_Work) are exploratory legacy
    developments with explicit named hypotheses; they are not part of the
    verified scope and are preserved at tag zenodo-v51 and branch
    archive/zenodo-v51-full-tree.
