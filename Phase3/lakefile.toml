name = "LatticeGauge"
defaultTargets = ["LatticeGauge"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.15.0"

[[lean_lib]]
name = "LatticeGauge"
globs = ["LatticeGauge.Basic", "LatticeGauge.GaugeInvariance", "LatticeGauge.Gibbs", "LatticeGauge.WilsonLoop", "LatticeGauge.Expectation", "LatticeGauge.WilsonExpectation", "LatticeGauge.GaugeSymmetry", "LatticeGauge.UnitaryChar", "LatticeGauge.HaarUnitary"]
