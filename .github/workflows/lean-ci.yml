name: Lean CI (all phases)

on:
  push:
    branches: [main, pedra39-sol]
  pull_request:
  workflow_dispatch:

jobs:
  build-phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Resolve dependencies (pinned Mathlib)
        working-directory: Phase2
        run: lake update

      - name: Fetch Mathlib build cache
        working-directory: Phase2
        run: lake exe cache get

      - name: Build Phase 2
        working-directory: Phase2
        run: lake build 2>&1 | tee ../kernel_raw.log

      - name: Kernel X-ray report
        run: python3 scripts/kernel_xray.py kernel_raw.log docs/audit

      - name: Upload kernel X-ray artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-xray-raw-log
          path: |
            kernel_raw.log
            docs/audit/KERNEL_XRAY.md
            docs/audit/KERNEL_XRAY.json
            docs/audit/KERNEL_XRAY.csv

      - name: Axiom report (phase2)
        if: success()
        working-directory: Phase2
        run: |
          echo "Build OK. Axiom inventory:"
          grep -rn "^axiom\|^\s*axiom" RGFlow_Work --include="*.lean" | wc -l

  build-phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Resolve dependencies
        working-directory: Phase1
        run: lake update
      - name: Fetch Mathlib cache
        working-directory: Phase1
        run: lake exe cache get
      - name: Build Phase 1 (whitelist)
        working-directory: Phase1
        run: lake build

  build-phase3:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Resolve dependencies
        working-directory: Phase3
        run: lake update
      - name: Fetch Mathlib cache
        working-directory: Phase3
        run: lake exe cache get
      - name: Build Phase 3
        working-directory: Phase3
        run: lake build
