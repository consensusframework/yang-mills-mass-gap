name: Lean CI (Phase 3)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-phase3:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Resolve dependencies
        working-directory: Phase3
        run: lake update
      - name: Fetch Mathlib cache
        working-directory: Phase3
        run: lake exe cache get
      - name: Build Phase 3
        working-directory: Phase3
        run: lake build

      - name: Kernel certificates (#print axioms of the v49/v50/v51 capstones)
        working-directory: Phase3
        run: |
          set -euo pipefail
          CERT="$(mktemp -d)/Certs.lean"
          cat > "$CERT" <<'EOF'
          import LatticeGauge.KPLogPartition
          import LatticeGauge.CovarianceDecay
          import LatticeGauge.ActivityRestrictionStability
          #print axioms LatticeGauge.logPartition_eq_tsum_unrooted
          #print axioms LatticeGauge.abs_gibbsCovariance_le_local_exp_decay
          #print axioms LatticeGauge.abs_gibbsExpectation_sub_activityRestrictedExpectation_le_local_exp_decay
          EOF
          lake env lean "$CERT" | tee "$RUNNER_TEMP/certs.log"
          # normalise whitespace: Lean may wrap long axiom lists across lines
          NORM="$(tr -d ' \n' < "$RUNNER_TEMP/certs.log")"
          if grep -q sorryAx "$RUNNER_TEMP/certs.log"; then echo "::error::sorryAx present"; exit 1; fi
          EXPECTED="[propext,Classical.choice,Quot.sound]"
          for D in \
            LatticeGauge.logPartition_eq_tsum_unrooted \
            LatticeGauge.abs_gibbsCovariance_le_local_exp_decay \
            LatticeGauge.abs_gibbsExpectation_sub_activityRestrictedExpectation_le_local_exp_decay; do
            if ! printf '%s' "$NORM" | grep -qF "'$D'dependsonaxioms:$EXPECTED"; then
              echo "::error::certificate of $D differs from $EXPECTED"; exit 1
            fi
          done
          echo "All three capstone certificates equal $EXPECTED; no sorryAx."
